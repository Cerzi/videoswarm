<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Video Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow-x: hidden;
        }

        .header {
            background: #2d2d2d;
            padding: 1rem 2rem;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background: #007acc;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .file-input-label:hover {
            background: #0066a3;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-left: auto;
        }

        .toggle-button {
            background: #404040;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .toggle-button.active {
            background: #007acc;
        }

        .toggle-button:hover {
            background: #555;
        }

        .toggle-button.active:hover {
            background: #0066a3;
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .zoom-slider {
            width: 120px;
            height: 4px;
            background: #404040;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .zoom-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #007acc;
            border-radius: 50%;
            cursor: pointer;
        }

        .drop-zone {
            margin: 2rem;
            padding: 4rem;
            border: 2px dashed #404040;
            border-radius: 12px;
            text-align: center;
            color: #888;
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            border-color: #007acc;
            background: rgba(0, 122, 204, 0.1);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2px;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .video-grid.masonry-vertical {
            display: block;
            column-count: auto;
            column-width: 250px;
            column-gap: 8px;
            padding: 1rem;
        }

        .video-grid.masonry-horizontal {
            display: block;
            column-count: auto;
            column-width: 350px;
            column-gap: 8px;
            padding: 1rem;
        }

        .video-grid.masonry-vertical .video-item,
        .video-grid.masonry-horizontal .video-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 8px;
            break-inside: avoid;
            transition: transform 0.2s ease;
        }

        .video-grid.masonry-vertical .video-item:hover,
        .video-grid.masonry-horizontal .video-item:hover {
            transform: scale(1.02);
            z-index: 10;
        }

        .video-item {
            position: relative;
            background: #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .video-item:hover {
            transform: scale(1.05);
            border-color: #007acc;
            box-shadow: 0 8px 32px rgba(0, 122, 204, 0.3);
            z-index: 10;
        }

        .video-item.selected {
            border-color: #007acc;
            background: rgba(0, 122, 204, 0.2);
        }

        .video-item.error {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .video-item.loading {
            border-color: #ffa500;
            background: rgba(255, 165, 0, 0.1);
        }

        .video-element {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
            background: #2d2d2d;
        }

        .video-grid.masonry-vertical .video-element,
        .video-grid.masonry-horizontal .video-element {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .video-grid.masonry-horizontal .video-element {
            aspect-ratio: 21/9;
            object-fit: cover;
        }

        .video-placeholder {
            width: 100%;
            background: #2d2d2d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            min-height: 140px;
            cursor: pointer;
        }

        .video-grid.masonry-vertical .video-placeholder {
            height: auto;
            aspect-ratio: 16/9;
            min-height: 100px;
        }

        .video-grid.masonry-horizontal .video-placeholder {
            height: auto;
            aspect-ratio: 21/9;
            min-height: 100px;
        }

        .video-filename {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            color: white;
            padding: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading-indicator,
        .error-indicator,
        .unsupported-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 0.8rem;
            z-index: 2;
        }

        .loading-indicator { color: #007acc; }
        .error-indicator { color: #ff4444; }
        .unsupported-indicator { color: #ffa500; }

        .context-menu {
            position: fixed;
            background: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 0.5rem 0;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            min-width: 180px;
            display: none;
        }

        .context-menu-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }

        .context-menu-item:hover {
            background: #404040;
        }

        .context-menu-separator {
            height: 1px;
            background: #404040;
            margin: 0.5rem 0;
        }

        .selection-info {
            background: #007acc;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Zoom levels */
        .video-grid.zoom-small { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        .video-grid.zoom-medium { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        .video-grid.zoom-large { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .video-grid.zoom-xlarge { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }

        .video-grid.zoom-small.masonry-vertical { column-width: 180px; }
        .video-grid.zoom-medium.masonry-vertical { column-width: 250px; }
        .video-grid.zoom-large.masonry-vertical { column-width: 350px; }
        .video-grid.zoom-xlarge.masonry-vertical { column-width: 500px; }

        .video-grid.zoom-small.masonry-horizontal { column-width: 280px; }
        .video-grid.zoom-medium.masonry-horizontal { column-width: 350px; }
        .video-grid.zoom-large.masonry-horizontal { column-width: 450px; }
        .video-grid.zoom-xlarge.masonry-horizontal { column-width: 600px; }

        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1px;
                padding: 0.5rem;
            }
            .header {
                padding: 1rem;
                flex-wrap: wrap;
            }
        }

        html { scroll-behavior: smooth; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-indicator::before {
            content: '⟳';
            animation: spin 1s linear infinite;
            font-size: 1.2rem;
        }

        /* Video state indicators */
        .video-item::after {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            opacity: 0.7;
            z-index: 3;
        }

        .video-item.playing::after {
            background: #00ff00;
            animation: pulse 2s infinite;
        }

        .video-item.paused::after {
            background: #ffa500;
        }

        .video-item.error::after {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .retry-button {
            background: #007acc;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .retry-button:hover {
            background: #0066a3;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 Video Browser <span style="font-size: 0.6rem; color: #666; font-weight: normal;">v3.5</span></h1>

        <div class="file-input-wrapper">
            <input type="file" id="fileInput" class="file-input" webkitdirectory multiple>
            <label for="fileInput" class="file-input-label">Open Folder</label>
        </div>

        <div class="selection-info" id="selectionInfo" style="display: none;">
            0 selected
        </div>

        <div class="debug-info" id="debugInfo" style="font-size: 0.75rem; color: #888; background: #1a1a1a; padding: 0.3rem 0.8rem; border-radius: 4px;">
            Ready
        </div>

        <div class="controls">
            <button id="sortToggle" class="toggle-button">📶 Sort: None</button>
            <button id="layoutToggle" class="toggle-button">📐 Aspect Ratio</button>
            <button id="autoplayToggle" class="toggle-button active">⏸️ Pause All</button>

            <div class="zoom-control">
                <span>🔍</span>
                <input type="range" id="zoomSlider" class="zoom-slider" min="0" max="3" value="1" step="1">
                <span id="zoomLabel">100%</span>
            </div>
        </div>
    </div>

    <div class="drop-zone" id="dropZone">
        <h2>Drop video files here</h2>
        <p>Or use the "Open Folder" button above</p>
        <p style="margin-top: 1rem; color: #666; font-size: 0.8rem;">
            Supports: MP4, MOV, AVI, MKV, WebM, M4V, FLV, WMV, 3GP, OGV
        </p>
    </div>

    <div class="video-grid" id="videoGrid"></div>

    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" data-action="show-folder">📁 Show in File Manager</div>
        <div class="context-menu-item" data-action="copy-path">📋 Copy File Path</div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" data-action="copy">📄 Copy</div>
        <div class="context-menu-item" data-action="delete">🗑️ Delete</div>
        <div class="context-menu-item" data-action="retry">🔄 Retry Load</div>
    </div>

    <script>
        class VideoBrowser {
            constructor() {
                this.videos = new Set();
                this.selectedVideos = new Set();
                this.videoElements = new Map();
                this.zoomLevels = ['zoom-small', 'zoom-medium', 'zoom-large', 'zoom-xlarge'];
                this.zoomLabels = ['75%', '100%', '150%', '200%'];
                this.currentContextVideo = null;
                this.autoplayEnabled = true;
                this.loadingVideos = new Set();

                // Layout modes
                this.layoutMode = 'grid';
                this.aspectRatioCache = new Map();

                // Sorting
                this.sortMode = 'none';
                this.originalOrder = [];

                // Performance management - Conservative settings
                this.maxConcurrentPlaying = 15;
                this.maxConcurrentLoading = 2;
                this.maxLoadedVideos = 40;
                this.visibleVideos = new Set();
                this.playingVideos = new Set();
                this.loadedVideos = new Map();
                this.loadQueue = [];
                this.isProcessingQueue = false;
                this.failedVideos = new Set();

                // Video state tracking with better management
                this.videoStates = new Map();
                this.retryCount = new Map();
                this.maxRetries = 2;

                // Loop management
                this.loopManagers = new Map();

                // Intersection observer with more conservative settings
                this.intersectionObserver = new IntersectionObserver(
                    this.handleIntersection.bind(this),
                    {
                        rootMargin: '200px',
                        threshold: [0, 0.5, 1.0]
                    }
                );

                this.unloadObserver = new IntersectionObserver(
                    this.handleUnloadIntersection.bind(this),
                    {
                        rootMargin: '-400px',
                        threshold: 0
                    }
                );

                this.initializeEventListeners();
                this.startPerformanceMonitoring();
                this.setupMaintenanceLoop();
            }

            setupMaintenanceLoop() {
                // More aggressive maintenance for loop issues
                setInterval(() => {
                    this.checkAndFixLoops();
                    this.checkVideoStates();
                }, 2000);

                // Viewport change handling
                let scrollTimeout;
                window.addEventListener('scroll', () => {
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        this.checkViewportVideos();
                    }, 200);
                });
            }

            checkAndFixLoops() {
                this.videoElements.forEach((video, videoItem) => {
                    if (this.visibleVideos.has(videoItem) && this.autoplayEnabled) {
                        // Check if video should be playing but isn't
                        if (video.readyState >= 2 && video.paused && this.canPlayMoreVideos()) {
                            console.log(`Fixing stuck video: ${videoItem.dataset.filename}`);
                            this.playVideoSafely(video, videoItem);
                        }

                        // Check if video ended but didn't restart
                        if (video.ended && video.loop) {
                            console.log(`Restarting ended video: ${videoItem.dataset.filename}`);
                            video.currentTime = 0;
                            this.playVideoSafely(video, videoItem);
                        }

                        // Check for very short videos that might get stuck
                        if (video.duration > 0 && video.duration < 2 && video.currentTime >= video.duration - 0.1) {
                            video.currentTime = 0;
                        }
                    }
                });
            }

            checkVideoStates() {
                this.videoElements.forEach((video, videoItem) => {
                    const shouldBePlaying = this.visibleVideos.has(videoItem) &&
                                          this.autoplayEnabled &&
                                          this.canPlayMoreVideos();

                    const currentState = this.getVideoState(videoItem);

                    if (shouldBePlaying && currentState !== 'playing' && video.readyState >= 2) {
                        if (video.paused) {
                            this.playVideoSafely(video, videoItem);
                        }
                    } else if (!shouldBePlaying && currentState === 'playing') {
                        video.pause();
                        this.setVideoState(videoItem, 'paused');
                        this.playingVideos.delete(video);
                    }
                });
            }

            checkViewportVideos() {
                const viewportTop = window.scrollY;
                const viewportBottom = viewportTop + window.innerHeight;
                const buffer = 150;

                this.videos.forEach(videoItem => {
                    const rect = videoItem.getBoundingClientRect();
                    const elementTop = rect.top + window.scrollY;
                    const elementBottom = elementTop + rect.height;

                    const inExtendedViewport = elementBottom >= (viewportTop - buffer) &&
                                             elementTop <= (viewportBottom + buffer);

                    if (inExtendedViewport && videoItem.dataset.loaded === 'false' &&
                        !this.loadingVideos.has(videoItem) &&
                        !this.loadQueue.includes(videoItem) &&
                        !this.failedVideos.has(videoItem)) {

                        this.visibleVideos.add(videoItem);
                        this.loadQueue.push(videoItem);
                        this.updatePlaceholderStatus(videoItem, 'queued');
                    }
                });
            }

            getVideoState(videoItem) {
                return this.videoStates.get(videoItem) || 'unknown';
            }

            setVideoState(videoItem, state) {
                this.videoStates.set(videoItem, state);

                // Update visual indicators
                videoItem.classList.remove('playing', 'paused', 'loading', 'error');
                if (state !== 'unknown') {
                    videoItem.classList.add(state);
                }
            }

            updatePlaceholderStatus(videoItem, status) {
                const placeholder = videoItem.querySelector('.video-placeholder');
                if (!placeholder) return;

                const statusMessages = {
                    'loading': '📼 Loading...',
                    'queued': '📼 Queued...',
                    'failed': '❌ Failed to load',
                    'unsupported': '⚠️ Format issue',
                    'retry': '🔄 Click to retry',
                    'corrupted': '💥 File may be corrupted'
                };

                placeholder.innerHTML = `
                    <div>${statusMessages[status] || '📼 Ready'}</div>
                    ${(status === 'failed' || status === 'unsupported' || status === 'corrupted') ?
                        '<button class="retry-button">Retry</button>' : ''}
                `;

                const statusColors = {
                    'loading': '#2a4a2a',
                    'queued': '#2a3a4a',
                    'failed': '#4a2a2a',
                    'unsupported': '#4a3a2a',
                    'retry': '#3a2a4a',
                    'corrupted': '#5a1a1a'
                };

                placeholder.style.background = statusColors[status] || '#2d2d2d';

                // Add retry button functionality
                const retryButton = placeholder.querySelector('.retry-button');
                if (retryButton) {
                    retryButton.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.retryVideoLoad(videoItem);
                    });
                }
            }

            initializeEventListeners() {
                const fileInput = document.getElementById('fileInput');
                if (fileInput) {
                    fileInput.addEventListener('change', (e) => {
                        this.handleFileSelection(e.target.files);
                    });
                }

                const autoplayToggle = document.getElementById('autoplayToggle');
                if (autoplayToggle) {
                    autoplayToggle.addEventListener('click', () => {
                        this.toggleAutoplay();
                    });
                }

                const layoutToggle = document.getElementById('layoutToggle');
                if (layoutToggle) {
                    layoutToggle.addEventListener('click', () => {
                        this.toggleLayout();
                    });
                }

                const sortToggle = document.getElementById('sortToggle');
                if (sortToggle) {
                    sortToggle.addEventListener('click', () => {
                        this.toggleSort();
                    });
                }

                const dropZone = document.getElementById('dropZone');
                if (dropZone) {
                    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                        dropZone.addEventListener(eventName, this.preventDefaults, false);
                        document.body.addEventListener(eventName, this.preventDefaults, false);
                    });

                    ['dragenter', 'dragover'].forEach(eventName => {
                        dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
                    });

                    ['dragleave', 'drop'].forEach(eventName => {
                        dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
                    });

                    dropZone.addEventListener('drop', (e) => {
                        const files = Array.from(e.dataTransfer.files);
                        this.handleFileSelection(files);
                    }, false);
                }

                const zoomSlider = document.getElementById('zoomSlider');
                if (zoomSlider) {
                    zoomSlider.addEventListener('input', (e) => {
                        this.setZoom(parseInt(e.target.value));
                    });
                }

                const videoGrid = document.getElementById('videoGrid');
                if (videoGrid) {
                    videoGrid.addEventListener('wheel', (e) => {
                        if (e.ctrlKey) {
                            e.preventDefault();
                            const currentZoom = parseInt(zoomSlider.value);
                            const newZoom = e.deltaY > 0 ? Math.max(0, currentZoom - 1) : Math.min(3, currentZoom + 1);
                            zoomSlider.value = newZoom;
                            this.setZoom(newZoom);
                        }
                    });
                }

                document.addEventListener('click', () => this.hideContextMenu());
                const contextMenu = document.getElementById('contextMenu');
                if (contextMenu) {
                    contextMenu.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.handleContextMenuAction(e.target.dataset.action);
                    });
                }

                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'a') {
                        e.preventDefault();
                        this.selectAll();
                    } else if (e.key === 'Delete') {
                        this.deleteSelected();
                    } else if (e.key === 'Escape') {
                        this.clearSelection();
                    } else if (e.key === ' ') {
                        e.preventDefault();
                        this.toggleAutoplay();
                    }
                });
            }

            preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            async handleFileSelection(files) {
                const videoFiles = Array.from(files).filter(file => {
                    const isVideoType = file.type.startsWith('video/');
                    const hasVideoExtension = /\.(mp4|mov|avi|mkv|webm|m4v|flv|wmv|3gp|ogv)$/i.test(file.name);
                    return isVideoType || hasVideoExtension;
                });

                if (videoFiles.length === 0) {
                    this.updateDebugInfo();
                    return;
                }

                this.hideDropZone();
                this.clearVideos();

                this.originalOrder = [...videoFiles];

                videoFiles.forEach((file) => {
                    this.createVideoItem(file);
                });

                this.updateDebugInfo();
                this.applySorting();

                // Start loading after a brief delay
                setTimeout(() => this.processLoadQueue(), 200);
            }

            createVideoItem(file) {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.dataset.filename = file.name;
                videoItem.dataset.loaded = 'false';

                const placeholder = document.createElement('div');
                placeholder.className = 'video-placeholder';
                this.updatePlaceholderForLayout(placeholder);
                this.updatePlaceholderStatus(videoItem, 'queued');

                // Make placeholder clickable for retry
                placeholder.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.failedVideos.has(videoItem)) {
                        this.retryVideoLoad(videoItem);
                    }
                });

                const filename = document.createElement('div');
                filename.className = 'video-filename';
                filename.textContent = file.name;

                videoItem.appendChild(placeholder);
                videoItem.appendChild(filename);
                videoItem._file = file;

                videoItem.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (e.ctrlKey || e.metaKey) {
                        this.toggleSelection(videoItem);
                    } else {
                        this.clearSelection();
                        this.selectVideo(videoItem);
                    }
                });

                videoItem.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this.currentContextVideo = file;
                    this.currentContextVideoItem = videoItem;
                    this.showContextMenu(e.pageX, e.pageY);
                });

                const videoGrid = document.getElementById('videoGrid');
                if (videoGrid) {
                    videoGrid.appendChild(videoItem);
                }

                this.videos.add(videoItem);
                this.intersectionObserver.observe(videoItem);
                this.unloadObserver.observe(videoItem);
                this.setVideoState(videoItem, 'unknown');
                this.retryCount.set(videoItem, 0);

                // Animate entrance
                requestAnimationFrame(() => {
                    videoItem.style.opacity = '0';
                    videoItem.style.transform = 'scale(0.8)';
                    requestAnimationFrame(() => {
                        videoItem.style.transition = 'all 0.3s ease';
                        videoItem.style.opacity = '1';
                        videoItem.style.transform = 'scale(1)';
                    });
                });

                return videoItem;
            }

            retryVideoLoad(videoItem) {
                console.log(`Retrying load for: ${videoItem.dataset.filename}`);

                const currentRetries = this.retryCount.get(videoItem) || 0;
                if (currentRetries >= this.maxRetries) {
                    this.updatePlaceholderStatus(videoItem, 'corrupted');
                    return;
                }

                this.retryCount.set(videoItem, currentRetries + 1);
                this.failedVideos.delete(videoItem);
                videoItem.classList.remove('error');

                // Clean up any existing error indicators
                const indicators = videoItem.querySelectorAll('.error-indicator, .unsupported-indicator');
                indicators.forEach(indicator => indicator.remove());

                // Add back placeholder if needed
                if (!videoItem.querySelector('.video-placeholder')) {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'video-placeholder';
                    this.updatePlaceholderForLayout(placeholder);
                    const filename = videoItem.querySelector('.video-filename');
                    videoItem.insertBefore(placeholder, filename);
                }

                this.updatePlaceholderStatus(videoItem, 'queued');
                this.loadQueue.push(videoItem);

                if (!this.isProcessingQueue) {
                    this.processLoadQueue();
                }
            }

            updatePlaceholderForLayout(placeholder) {
                if (this.layoutMode === 'grid') {
                    placeholder.style.cssText = `
                        width: 100%;
                        height: 140px;
                        background: #2d2d2d;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        color: #666;
                        font-size: 0.8rem;
                        cursor: pointer;
                    `;
                } else {
                    placeholder.style.cssText = `
                        width: 100%;
                        background: #2d2d2d;
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        color: #666;
                        font-size: 0.8rem;
                        cursor: pointer;
                    `;
                }
            }

            toggleSort() {
                const sortButton = document.getElementById('sortToggle');
                if (!sortButton) return;

                const modes = ['none', 'name-asc', 'name-desc'];
                const currentIndex = modes.indexOf(this.sortMode);
                const nextIndex = (currentIndex + 1) % modes.length;
                this.sortMode = modes[nextIndex];

                const buttonTexts = {
                    'none': '📶 Sort: None',
                    'name-asc': '📶 Name ↑',
                    'name-desc': '📶 Name ↓'
                };
                sortButton.textContent = buttonTexts[this.sortMode];

                this.applySorting();
            }

            applySorting() {
                const grid = document.getElementById('videoGrid');
                if (!grid) return;

                const videoItems = Array.from(this.videos);

                if (this.sortMode === 'none') {
                    videoItems.sort((a, b) => {
                        const aIndex = this.originalOrder.findIndex(file => file.name === a.dataset.filename);
                        const bIndex = this.originalOrder.findIndex(file => file.name === b.dataset.filename);
                        return aIndex - bIndex;
                    });
                } else if (this.sortMode === 'name-asc') {
                    videoItems.sort((a, b) => a.dataset.filename.localeCompare(b.dataset.filename));
                } else if (this.sortMode === 'name-desc') {
                    videoItems.sort((a, b) => b.dataset.filename.localeCompare(a.dataset.filename));
                }

                videoItems.forEach(item => {
                    grid.appendChild(item);
                });
            }

            async loadVideoContent(videoItem) {
                if (videoItem.dataset.loaded === 'true' || this.loadingVideos.has(videoItem)) {
                    return;
                }

                const file = videoItem._file;
                if (!file) return;

                this.loadingVideos.add(videoItem);
                this.setVideoState(videoItem, 'loading');
                this.updatePlaceholderStatus(videoItem, 'loading');

                return new Promise((resolve, reject) => {
                    const video = document.createElement('video');
                    video.className = 'video-element';
                    video.muted = true;
                    video.loop = true;
                    video.preload = 'metadata';
                    video.playsInline = true;
                    video.setAttribute('playsinline', '');
                    video.setAttribute('webkit-playsinline', '');

                    // More robust video settings
                    video.crossOrigin = 'anonymous';
                    video.controls = false;

                    let hasLoaded = false;
                    let hasErrored = false;
                    let loadTimeout;
                    let objectUrl = null;

                    const cleanup = () => {
                        this.loadingVideos.delete(videoItem);
                        clearTimeout(loadTimeout);
                        const placeholder = videoItem.querySelector('.video-placeholder');
                        if (placeholder && hasLoaded) placeholder.remove();
                    };

                    const onError = (error) => {
                        if (hasErrored) return;
                        hasErrored = true;

                        console.warn(`Video load error for ${file.name}:`, error);
                        cleanup();

                        // Clean up object URL on error
                        if (objectUrl) {
                            URL.revokeObjectURL(objectUrl);
                            objectUrl = null;
                        }

                        this.failedVideos.add(videoItem);
                        this.setVideoState(videoItem, 'error');

                        // Determine error type
                        let errorType = 'failed';
                        let errorMessage = '❌ Load Error';

                        if (error && error.message) {
                            if (error.message.includes('DEMUXER_ERROR_NO_SUPPORTED_STREAMS') ||
                                error.message.includes('no supported streams') ||
                                error.message.includes('FORMAT_ERROR')) {
                                errorType = 'unsupported';
                                errorMessage = '⚠️ Format Issue';
                            } else if (error.message.includes('NETWORK_ERROR') ||
                                     error.message.includes('DECODE_ERROR')) {
                                errorType = 'corrupted';
                                errorMessage = '💥 File Issue';
                            }
                        }

                        this.updatePlaceholderStatus(videoItem, errorType);
                        reject(error);
                    };

                    const onLoad = () => {
                        if (hasLoaded || hasErrored) return;
                        hasLoaded = true;

                        cleanup();
                        videoItem.dataset.loaded = 'true';

                        // Validate video
                        if (!video.videoWidth || !video.videoHeight || video.duration === 0) {
                            onError(new Error('Invalid video properties'));
                            return;
                        }

                        // Cache aspect ratio
                        const aspectRatio = video.videoWidth / video.videoHeight;
                        this.aspectRatioCache.set(videoItem, aspectRatio);

                        // Apply layout-specific styling
                        this.applyVideoStyling(video, videoItem);

                        // Set up enhanced loop management
                        this.setupLoopManager(video, videoItem);

                        // Replace placeholder with video
                        const placeholder = videoItem.querySelector('.video-placeholder');
                        if (placeholder) {
                            videoItem.replaceChild(video, placeholder);
                        } else {
                            videoItem.insertBefore(video, videoItem.querySelector('.video-filename'));
                        }

                        this.videoElements.set(videoItem, video);
                        this.loadedVideos.set(videoItem, Date.now());
                        this.setVideoState(videoItem, 'paused');

                        // Auto-play if visible and autoplay enabled
                        if (this.visibleVideos.has(videoItem) && this.autoplayEnabled && this.canPlayMoreVideos()) {
                            setTimeout(() => {
                                this.playVideoSafely(video, videoItem);
                            }, Math.random() * 500);
                        }

                        resolve();
                    };

                    // Set up timeout
                    loadTimeout = setTimeout(() => {
                        if (!hasLoaded && !hasErrored) {
                            onError(new Error('Loading timeout'));
                        }
                    }, 8000);

                    // Enhanced event listeners
                    video.addEventListener('loadedmetadata', () => {
                        if (video.videoWidth && video.videoHeight) {
                            onLoad();
                        }
                    });

                    video.addEventListener('canplay', onLoad);

                    video.addEventListener('error', (e) => {
                        const mediaError = e.target.error;
                        onError(mediaError || new Error('Unknown video error'));
                    });

                    // Handle stalled loading
                    video.addEventListener('stalled', () => {
                        console.warn(`Video stalled: ${file.name}`);
                        if (!hasLoaded && !hasErrored) {
                            setTimeout(() => {
                                if (!hasLoaded && !hasErrored) {
                                    onError(new Error('Video loading stalled'));
                                }
                            }, 3000);
                        }
                    });

                    // Handle abort
                    video.addEventListener('abort', () => {
                        if (!hasLoaded && !hasErrored) {
                            onError(new Error('Video loading aborted'));
                        }
                    });

                    try {
                        // Create object URL with error handling
                        objectUrl = URL.createObjectURL(file);
                        video._objectUrl = objectUrl;
                        video.src = objectUrl;
                        video.load();
                    } catch (error) {
                        onError(error);
                    }
                });
            }

            setupLoopManager(video, videoItem) {
                // Enhanced loop management to prevent freezing
                const loopManager = {
                    video: video,
                    videoItem: videoItem,
                    isManaging: false,
                    lastCurrentTime: 0,
                    stuckCount: 0
                };

                // Set up event handlers with better loop management
                video.addEventListener('play', () => {
                    this.setVideoState(videoItem, 'playing');
                    this.playingVideos.add(video);
                    loopManager.isManaging = true;
                    loopManager.stuckCount = 0;
                });

                video.addEventListener('pause', () => {
                    this.setVideoState(videoItem, 'paused');
                    this.playingVideos.delete(video);
                    loopManager.isManaging = false;
                });

                video.addEventListener('ended', () => {
                    if (video.loop && this.visibleVideos.has(videoItem) && this.autoplayEnabled) {
                        // Force restart for reliable looping
                        video.currentTime = 0;
                        setTimeout(() => {
                            this.playVideoSafely(video, videoItem);
                        }, 50);
                    }
                });

                // Monitor for stuck videos
                video.addEventListener('timeupdate', () => {
                    if (loopManager.isManaging) {
                        const currentTime = video.currentTime;

                        // Check if video is stuck
                        if (Math.abs(currentTime - loopManager.lastCurrentTime) < 0.1) {
                            loopManager.stuckCount++;

                            // If stuck for too long, restart
                            if (loopManager.stuckCount > 10) {
                                console.log(`Restarting stuck video: ${videoItem.dataset.filename}`);
                                video.currentTime = 0;
                                loopManager.stuckCount = 0;
                            }
                        } else {
                            loopManager.stuckCount = 0;
                        }

                        loopManager.lastCurrentTime = currentTime;

                        // Handle near-end looping for very short videos
                        if (video.duration > 0 && video.duration < 3 &&
                            currentTime >= video.duration - 0.2) {
                            video.currentTime = 0;
                        }
                    }
                });

                // Handle seeking issues
                video.addEventListener('seeking', () => {
                    loopManager.stuckCount = 0;
                });

                video.addEventListener('seeked', () => {
                    loopManager.lastCurrentTime = video.currentTime;
                });

                this.loopManagers.set(videoItem, loopManager);
            }

            playVideoSafely(video, videoItem) {
                if (!video || !videoItem) return;

                if (video.readyState >= 2 && this.canPlayMoreVideos() && this.autoplayEnabled) {
                    // Ensure video is ready for playback
                    if (video.currentTime >= video.duration && video.duration > 0) {
                        video.currentTime = 0;
                    }

                    video.play().then(() => {
                        this.playingVideos.add(video);
                        this.setVideoState(videoItem, 'playing');
                        console.log(`Playing: ${videoItem.dataset.filename}`);
                    }).catch(error => {
                        console.debug(`Autoplay failed for ${videoItem.dataset.filename}:`, error);
                        this.setVideoState(videoItem, 'paused');

                        // Retry with exponential backoff
                        const retryDelay = Math.min(1000 * Math.pow(2, (this.retryCount.get(videoItem) || 0)), 5000);
                        setTimeout(() => {
                            if (video.readyState >= 2 && this.autoplayEnabled &&
                                this.visibleVideos.has(videoItem) && this.canPlayMoreVideos()) {
                                this.playVideoSafely(video, videoItem);
                            }
                        }, retryDelay);
                    });
                }
            }

            applyVideoStyling(video, videoItem) {
                if (this.layoutMode === 'masonry-horizontal') {
                    video.style.aspectRatio = '21/9';
                    video.style.objectFit = 'cover';
                    video.style.width = '100%';
                    video.style.height = 'auto';
                } else if (this.layoutMode === 'masonry-vertical') {
                    const aspectRatio = this.aspectRatioCache.get(videoItem);
                    if (aspectRatio) {
                        video.style.aspectRatio = `${aspectRatio}`;
                    }
                    video.style.objectFit = 'contain';
                    video.style.width = '100%';
                    video.style.height = 'auto';
                } else {
                    // Grid mode
                    video.style.aspectRatio = '';
                    video.style.objectFit = 'cover';
                    video.style.width = '100%';
                    video.style.height = '140px';
                }
            }

            handleIntersection(entries) {
                entries.forEach(entry => {
                    const videoItem = entry.target;

                    if (entry.isIntersecting) {
                        this.visibleVideos.add(videoItem);

                        // Queue for loading if needed
                        if (videoItem.dataset.loaded === 'false' &&
                            !this.loadingVideos.has(videoItem) &&
                            !this.loadQueue.includes(videoItem) &&
                            !this.failedVideos.has(videoItem)) {
                            this.loadQueue.push(videoItem);
                            this.updatePlaceholderStatus(videoItem, 'queued');
                        }

                        // Try to play if loaded
                        const video = this.videoElements.get(videoItem);
                        if (video && this.autoplayEnabled && this.canPlayMoreVideos()) {
                            this.playVideoSafely(video, videoItem);
                        }
                    } else {
                        if (entry.intersectionRatio < 0.1) {
                            this.visibleVideos.delete(videoItem);

                            // Pause video when out of view
                            const video = this.videoElements.get(videoItem);
                            if (video && !video.paused) {
                                video.pause();
                                this.setVideoState(videoItem, 'paused');
                                this.playingVideos.delete(video);
                            }
                        }
                    }
                });

                // Process load queue
                if (!this.isProcessingQueue && this.loadQueue.length > 0) {
                    this.processLoadQueue();
                }

                // Memory management
                if (this.loadedVideos.size > this.maxLoadedVideos * 1.2) {
                    this.aggressiveCleanup();
                }
            }

            handleUnloadIntersection(entries) {
                entries.forEach(entry => {
                    const videoItem = entry.target;

                    if (!entry.isIntersecting &&
                        !this.visibleVideos.has(videoItem) &&
                        videoItem.dataset.loaded === 'true' &&
                        this.loadedVideos.size > this.maxLoadedVideos) {

                        const rect = videoItem.getBoundingClientRect();
                        const viewportHeight = window.innerHeight;
                        const distanceFromViewport = Math.min(
                            Math.abs(rect.bottom),
                            Math.abs(rect.top - viewportHeight)
                        );

                        if (distanceFromViewport > viewportHeight * 1.5) {
                            this.unloadVideoContent(videoItem);
                        }
                    }
                });
            }

            async processLoadQueue() {
                if (this.isProcessingQueue) return;
                this.isProcessingQueue = true;

                let processed = 0;
                const maxBatchSize = 2; // Reduced batch size

                while (this.loadQueue.length > 0 &&
                       this.loadingVideos.size < this.maxConcurrentLoading &&
                       processed < maxBatchSize) {

                    const videoItem = this.loadQueue.shift();

                    if (videoItem.dataset.loaded === 'false' && !this.loadingVideos.has(videoItem)) {
                        // Check if still in viewport
                        const rect = videoItem.getBoundingClientRect();
                        const inExtendedViewport = rect.bottom >= -300 && rect.top <= window.innerHeight + 300;

                        if (inExtendedViewport || this.visibleVideos.has(videoItem)) {
                            try {
                                await this.loadVideoContent(videoItem);
                                processed++;
                            } catch (error) {
                                console.warn(`Failed to load video ${videoItem.dataset.filename}:`, error);
                            }

                            // Delay between loads
                            if (processed < maxBatchSize && this.loadQueue.length > 0) {
                                await new Promise(resolve => setTimeout(resolve, 100));
                            }
                        }
                    }
                }

                this.isProcessingQueue = false;

                // Continue processing if needed
                if (this.loadQueue.length > 0 && this.loadingVideos.size < this.maxConcurrentLoading) {
                    setTimeout(() => this.processLoadQueue(), 300);
                }
            }

            aggressiveCleanup() {
                console.log(`Starting cleanup. Currently loaded: ${this.loadedVideos.size}`);

                const candidatesForUnload = [];
                this.loadedVideos.forEach((timestamp, videoItem) => {
                    if (!this.visibleVideos.has(videoItem)) {
                        const rect = videoItem.getBoundingClientRect();
                        const distance = Math.min(
                            Math.abs(rect.bottom),
                            Math.abs(rect.top - window.innerHeight)
                        );
                        candidatesForUnload.push({ videoItem, distance, timestamp });
                    }
                });

                candidatesForUnload
                    .sort((a, b) => b.distance - a.distance)
                    .slice(0, Math.max(3, candidatesForUnload.length * 0.4))
                    .forEach(({ videoItem }) => {
                        this.unloadVideoContent(videoItem);
                    });

                console.log(`Cleanup complete. Now loaded: ${this.loadedVideos.size}`);
            }

            unloadVideoContent(videoItem) {
                const video = this.videoElements.get(videoItem);
                if (!video) return;

                console.log(`Unloading video: ${videoItem.dataset.filename}`);

                // Clean up loop manager
                this.loopManagers.delete(videoItem);

                // Pause and clean up video
                video.pause();
                this.playingVideos.delete(video);
                this.setVideoState(videoItem, 'unknown');

                // Clean up object URL
                if (video._objectUrl) {
                    URL.revokeObjectURL(video._objectUrl);
                    delete video._objectUrl;
                }

                video.removeAttribute('src');
                video.load();

                // Remove from tracking
                this.videoElements.delete(videoItem);
                this.loadedVideos.delete(videoItem);
                this.loadingVideos.delete(videoItem);

                // Remove from queue if present
                const queueIndex = this.loadQueue.indexOf(videoItem);
                if (queueIndex > -1) {
                    this.loadQueue.splice(queueIndex, 1);
                }

                // Create new placeholder
                const placeholder = document.createElement('div');
                placeholder.className = 'video-placeholder';
                this.updatePlaceholderForLayout(placeholder);
                this.updatePlaceholderStatus(videoItem, 'retry');

                placeholder.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!this.loadQueue.includes(videoItem)) {
                        this.updatePlaceholderStatus(videoItem, 'queued');
                        this.loadQueue.push(videoItem);
                        this.processLoadQueue();
                    }
                });

                // Replace video with placeholder
                const filename = videoItem.querySelector('.video-filename');
                videoItem.innerHTML = '';
                videoItem.appendChild(placeholder);
                if (filename) videoItem.appendChild(filename);

                videoItem.dataset.loaded = 'false';

                // Force garbage collection if available
                if (window.gc) {
                    setTimeout(() => window.gc(), 100);
                }
            }

            toggleLayout() {
                const layoutButton = document.getElementById('layoutToggle');
                if (!layoutButton) return;

                const modes = ['grid', 'masonry-vertical', 'masonry-horizontal'];
                const currentIndex = modes.indexOf(this.layoutMode);
                const nextIndex = (currentIndex + 1) % modes.length;
                this.layoutMode = modes[nextIndex];

                const buttonTexts = {
                    'grid': '📐 Aspect Ratio',
                    'masonry-vertical': '📐 Vertical',
                    'masonry-horizontal': '📐 Horizontal'
                };
                layoutButton.textContent = buttonTexts[this.layoutMode];

                this.applyLayout();
                this.updateVideosForLayout();
            }

            applyLayout() {
                const grid = document.getElementById('videoGrid');
                if (!grid) return;

                grid.classList.remove('masonry-vertical', 'masonry-horizontal');

                if (this.layoutMode !== 'grid') {
                    grid.classList.add(this.layoutMode);
                }
            }

            updateVideosForLayout() {
                // Update existing videos
                this.videoElements.forEach((video, videoItem) => {
                    this.applyVideoStyling(video, videoItem);
                });

                // Update placeholders
                this.videos.forEach(videoItem => {
                    if (videoItem.dataset.loaded === 'false') {
                        const placeholder = videoItem.querySelector('.video-placeholder');
                        if (placeholder) {
                            this.updatePlaceholderForLayout(placeholder);
                        }
                    }
                });
            }

            canPlayMoreVideos() {
                return this.playingVideos.size < this.maxConcurrentPlaying;
            }

            startPerformanceMonitoring() {
                setInterval(() => {
                    if (performance.memory) {
                        const memoryRatio = performance.memory.usedJSHeapSize / performance.memory.jsHeapSizeLimit;

                        if (memoryRatio > 0.8) {
                            this.maxConcurrentPlaying = Math.max(2, this.maxConcurrentPlaying - 3);
                            this.maxLoadedVideos = Math.max(10, this.maxLoadedVideos - 10);
                            this.emergencyCleanup();
                        } else if (memoryRatio > 0.6) {
                            this.maxConcurrentPlaying = Math.max(5, this.maxConcurrentPlaying - 2);
                            this.maxLoadedVideos = Math.max(20, this.maxLoadedVideos - 5);
                            this.aggressiveCleanup();
                        } else if (memoryRatio < 0.4) {
                            this.maxConcurrentPlaying = Math.min(15, this.maxConcurrentPlaying + 1);
                            this.maxLoadedVideos = Math.min(40, this.maxLoadedVideos + 2);
                        }
                    }

                    this.updateDebugInfo();
                }, 4000);
            }

            emergencyCleanup() {
                console.log('EMERGENCY CLEANUP - High memory usage detected');

                this.pauseAllVideos();

                const toUnload = [];
                this.loadedVideos.forEach((timestamp, videoItem) => {
                    if (!this.visibleVideos.has(videoItem)) {
                        toUnload.push(videoItem);
                    }
                });

                toUnload.forEach(videoItem => {
                    this.unloadVideoContent(videoItem);
                });

                console.log(`Emergency cleanup complete. Unloaded ${toUnload.length} videos`);
            }

            updateDebugInfo() {
                const debugInfo = document.getElementById('debugInfo');
                if (!debugInfo) return;

                const memoryInfo = performance.memory ?
                    ` | ${Math.round(performance.memory.usedJSHeapSize / 1024 / 1024)}MB` : '';

                const errorCount = this.failedVideos.size;
                const errorInfo = errorCount > 0 ? ` | ❌ ${errorCount}` : '';

                debugInfo.textContent =
                    `▶️ ${this.playingVideos.size}/${this.maxConcurrentPlaying} | ` +
                    `📼 ${this.loadedVideos.size}/${this.maxLoadedVideos} | ` +
                    `📁 ${this.videos.size}${errorInfo}${memoryInfo}`;
            }

            toggleAutoplay() {
                this.autoplayEnabled = !this.autoplayEnabled;
                const button = document.getElementById('autoplayToggle');
                if (!button) return;

                if (this.autoplayEnabled) {
                    button.textContent = '⏸️ Pause All';
                    button.classList.add('active');
                    this.startAllVideos();
                } else {
                    button.textContent = '▶️ Resume All';
                    button.classList.remove('active');
                    this.pauseAllVideos();
                }
            }

            startAllVideos() {
                this.videoElements.forEach((video, videoItem) => {
                    if (this.visibleVideos.has(videoItem) && this.canPlayMoreVideos()) {
                        this.playVideoSafely(video, videoItem);
                    }
                });
            }

            pauseAllVideos() {
                this.videoElements.forEach((video, videoItem) => {
                    if (!video.paused) {
                        video.pause();
                        this.setVideoState(videoItem, 'paused');
                        this.playingVideos.delete(video);
                    }
                });
            }

            // Selection and UI methods
            selectVideo(videoItem) {
                videoItem.classList.add('selected');
                this.selectedVideos.add(videoItem);
                this.updateSelectionInfo();
            }

            toggleSelection(videoItem) {
                if (this.selectedVideos.has(videoItem)) {
                    videoItem.classList.remove('selected');
                    this.selectedVideos.delete(videoItem);
                } else {
                    this.selectVideo(videoItem);
                }
            }

            clearSelection() {
                this.selectedVideos.forEach(item => item.classList.remove('selected'));
                this.selectedVideos.clear();
                this.updateSelectionInfo();
            }

            selectAll() {
                this.videos.forEach(item => this.selectVideo(item));
            }

            updateSelectionInfo() {
                const info = document.getElementById('selectionInfo');
                if (!info) return;

                const count = this.selectedVideos.size;

                if (count === 0) {
                    info.style.display = 'none';
                } else {
                    info.style.display = 'block';
                    info.textContent = `${count} selected`;
                }
            }

            setZoom(level) {
                const grid = document.getElementById('videoGrid');
                const zoomLabel = document.getElementById('zoomLabel');
                if (!grid || !zoomLabel) return;

                this.zoomLevels.forEach(cls => grid.classList.remove(cls));
                grid.classList.add(this.zoomLevels[level]);
                zoomLabel.textContent = this.zoomLabels[level];
            }

            showContextMenu(x, y) {
                const menu = document.getElementById('contextMenu');
                if (!menu) return;

                menu.style.display = 'block';
                menu.style.left = `${x}px`;
                menu.style.top = `${y}px`;

                const rect = menu.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    menu.style.left = `${x - rect.width}px`;
                }
                if (rect.bottom > window.innerHeight) {
                    menu.style.top = `${y - rect.height}px`;
                }
            }

            hideContextMenu() {
                const menu = document.getElementById('contextMenu');
                if (menu) menu.style.display = 'none';
            }

            handleContextMenuAction(action) {
                this.hideContextMenu();

                switch (action) {
                    case 'show-folder':
                        this.showInFileManager();
                        break;
                    case 'copy-path':
                        this.copyFilePath();
                        break;
                    case 'copy':
                        this.copySelected();
                        break;
                    case 'delete':
                        this.deleteSelected();
                        break;
                    case 'retry':
                        if (this.currentContextVideoItem) {
                            this.retryVideoLoad(this.currentContextVideoItem);
                        }
                        break;
                }
            }

            showInFileManager() {
                if (this.currentContextVideo) {
                    alert(`Would open file manager for: ${this.currentContextVideo.name}`);
                }
            }

            copyFilePath() {
                if (this.currentContextVideo) {
                    navigator.clipboard.writeText(this.currentContextVideo.name).then(() => {
                        console.log('Filename copied to clipboard');
                    });
                }
            }

            copySelected() {
                const count = this.selectedVideos.size;
                if (count > 0) {
                    console.log(`Would copy ${count} selected videos`);
                }
            }

            deleteSelected() {
                if (this.selectedVideos.size === 0) return;

                const count = this.selectedVideos.size;
                if (confirm(`Delete ${count} selected video(s)?`)) {
                    this.selectedVideos.forEach(item => {
                        const video = this.videoElements.get(item);
                        if (video) {
                            if (video._objectUrl) {
                                URL.revokeObjectURL(video._objectUrl);
                            }
                            video.pause();
                            this.playingVideos.delete(video);
                        }

                        // Clean up all references
                        this.videoElements.delete(item);
                        this.loadedVideos.delete(item);
                        this.loadingVideos.delete(item);
                        this.failedVideos.delete(item);
                        this.visibleVideos.delete(item);
                        this.videoStates.delete(item);
                        this.retryCount.delete(item);
                        this.loopManagers.delete(item);

                        this.intersectionObserver.unobserve(item);
                        this.unloadObserver.unobserve(item);

                        item.remove();
                        this.videos.delete(item);
                    });

                    this.selectedVideos.clear();
                    this.updateSelectionInfo();
                    this.updateDebugInfo();
                }
            }

            clearVideos() {
                // Clean up all videos
                this.videos.forEach(videoItem => {
                    this.intersectionObserver.unobserve(videoItem);
                    this.unloadObserver.unobserve(videoItem);
                });

                this.videoElements.forEach((video, videoItem) => {
                    if (video) {
                        video.pause();
                        if (video._objectUrl) {
                            URL.revokeObjectURL(video._objectUrl);
                        }
                        video.removeAttribute('src');
                        video.load();
                    }
                    videoItem.remove();
                });

                // Clear all tracking sets and maps
                this.videos.clear();
                this.videoElements.clear();
                this.selectedVideos.clear();
                this.loadingVideos.clear();
                this.visibleVideos.clear();
                this.playingVideos.clear();
                this.loadedVideos.clear();
                this.failedVideos.clear();
                this.videoStates.clear();
                this.aspectRatioCache.clear();
                this.retryCount.clear();
                this.loopManagers.clear();
                this.loadQueue = [];

                this.updateSelectionInfo();
                this.updateDebugInfo();
            }

            hideDropZone() {
                const dropZone = document.getElementById('dropZone');
                if (dropZone) dropZone.style.display = 'none';
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            new VideoBrowser();
        });
    </script>
</body>
</html>
