<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Browser - Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .redirect-message {
            text-align: center;
            padding: 2rem;
            background: #2d2d2d;
            border-radius: 12px;
            border: 1px solid #404040;
        }
        .redirect-message h1 {
            color: #007acc;
            margin-bottom: 1rem;
        }
        .redirect-message p {
            margin-bottom: 1rem;
            color: #aaa;
        }
        .redirect-message a {
            color: #007acc;
            text-decoration: none;
            font-weight: 500;
        }
        .redirect-message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>🎬 Video Browser</h1>
        <p>This project has been refactored into a modular structure.</p>
        <p>Please use <a href="index.html">index.html</a> instead.</p>
        <p><small>Redirecting in <span id="countdown">3</span> seconds...</small></p>
    </div>

    <script>
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
