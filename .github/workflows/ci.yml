name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
    paths-ignore:                   # don’t run for docs/notes-only changes
      - '**.md'
      - 'docs/**'
      - '.github/release-drafter.yml'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage (Electron ABI)
        run: npm run test:coverage

      - name: Build renderer
        run: npm run vite:build

      - name: Install Electron smoke-test display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Electron production smoke test
        run: xvfb-run -a npm run test:electron-smoke

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Electron pack (no installers)
        run: npm run electron:pack
