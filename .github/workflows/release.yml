name: Release

on:
  push:
    tags:
      - "v*"            # ex: v0.3.0, v0.3.0-rc.1
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Show builder versions
        run: |
          node -v
          npm -v
          npx electron-builder --version || true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            icnsutils graphicsmagick xz-utils rpm

      - name: Build (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder*
        run: npm run electron:dist

      - name: Collect artifacts (explicit + fallback)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist_upload

          # Prefer common electron-builder outputs — adjust if your builder emits different extensions
          cp -v dist/*.AppImage dist_upload/ 2>/dev/null || true
          cp -v dist/*.exe dist_upload/ 2>/dev/null || true
          cp -v dist/*.AppImage z* 2>/dev/null || true || true
          cp -v dist/*.zip dist_upload/ 2>/dev/null || true
          cp -v dist/*.yml dist_upload/ 2>/dev/null || true
          cp -v dist/*.blockmap dist_upload/ 2>/dev/null || true

          # If the specific patterns didn't match, copy everything under dist as a fallback
          if [ -z "$(ls -A dist_upload 2>/dev/null || true)" ]; then
            echo "No specific artifacts matched; copying full dist/ as fallback"
            cp -rv dist/* dist_upload/ || true
          fi

          echo "Contents of dist_upload:"
          ls -la dist_upload || true

      - name: List dist_upload contents
        shell: bash
        run: |
          echo "pwd = $(pwd)"
          ls -la dist_upload || true

      - name: Upload artifacts (per-OS)
        uses: actions/upload-artifact@v4
        with:
          name: videoswarm-${{ runner.os }}-artifacts
          path: dist_upload
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts (merged)
        uses: actions/download-artifact@v4
        with:
          # Prefer explicit names to avoid mismatches; keep wildcard as safe fallback
          pattern: |
            videoswarm-ubuntu-latest-artifacts
            videoswarm-windows-latest-artifacts
            videoswarm-*-artifacts
          merge-multiple: true
          path: collected

      - name: Ensure collected dir exists + debug
        shell: bash
        run: |
          set -euo pipefail
          # Make sure the directory exists so steps with working-directory don't fail
          mkdir -p collected

          echo "=== Workspace root ==="
          ls -la || true

          echo "=== collected top-level ==="
          ls -la collected || true

          # If collected is empty, list workflow artifacts via API for debugging
          if [ -z "$(ls -A collected 2>/dev/null || true)" ]; then
            echo "collected/ is empty. Listing workflow artifacts via GitHub API..."
            gh api -H "Accept: application/vnd.github.v3+json" \
               /repos/${{ github.repository }}/actions/artifacts \
               --jq '.artifacts[] | {name: .name, id: .id, expired: .expired}' || true
            echo "If no artifacts are present, inspect the Build job logs (List dist_upload contents)."
          fi

      - name: Checkout repository (needed for gh/git commands)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes (Release Drafter)
        id: notes
        uses: release-drafter/release-drafter@v6
        with:
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare notes file (fallback if empty)
        shell: bash
        run: |
          printf "%s" "${{ steps.notes.outputs.body }}" > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "Release ${{ github.ref_name }}" > NOTES.md
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate unified SHA256SUMS (collected)
        shell: bash
        working-directory: collected
        run: |
          set -euo pipefail
          if [ -z "$(ls -A . 2>/dev/null || true)" ]; then
            echo "collected/ is empty; skipping checksum generation"
            exit 0
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            find . -type f -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          else
            find . -type f -print0 | xargs -0 shasum -a 256 > SHA256SUMS.txt
          fi
          echo "SHA256SUMS.txt contents:"
          cat SHA256SUMS.txt || true

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              $([ "$(echo "$TAG" | grep -c -- '-rc')" -gt 0 ] && echo --prerelease) \
              --title "$TAG" --notes-file NOTES.md
          else
            gh release edit "$TAG" --draft \
              $([ "$(echo "$TAG" | grep -c -- '-rc')" -gt 0 ] && echo --prerelease) \
              --title "$TAG" --notes-file NOTES.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: List collected contents before upload
        shell: bash
        run: |
          echo "Collected files to upload:"
          find collected -type f -maxdepth 4 -print || true

      - name: Upload assets (files only; clobber duplicates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mapfile -d '' files < <(find collected -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files found under collected/ — nothing to upload"
            exit 0
          fi
          echo "Uploading ${#files[@]} files to release $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber
