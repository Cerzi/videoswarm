name: Release

on:
  push:
    tags:
      - "v*" # ex: v0.3.0, v0.3.0-rc.1
  workflow_dispatch:

# Needed for creating/editing releases and uploading assets
permissions:
  contents: write
  pull-requests: read

# Avoid overlapping runs for the same ref
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Show builder versions
        run: |
          node -v
          npm -v
          npx electron-builder --version || true

      # Linux-only build deps commonly needed by electron-builder
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            icnsutils graphicsmagick xz-utils rpm

      # Build per OS (electron-builder under the hood via your scripts)
      # NOTE: Do not set GH_TOKEN here to avoid electron-builder trying to publish on its own.
      - name: Build (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder*
        run: npm run electron:dist

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist_upload
          cp -r dist/* dist_upload/ || true

      - name: List dist_upload contents
        shell: bash
        run: |
          echo "pwd = $(pwd)"
          ls -la dist_upload || true

      - name: Upload artifacts (per-OS)
        uses: actions/upload-artifact@v4
        with:
          name: videoswarm-${{ runner.os }}-artifacts
          path: dist_upload
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts (merged)
        uses: actions/download-artifact@v4
        with:
          pattern: videoswarm-*-artifacts
          merge-multiple: true
          path: collected

      - name: Checkout repository (needed for gh/git commands)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes (Release Drafter)
        id: notes
        uses: release-drafter/release-drafter@v6
        with:
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare notes file (fallback if empty)
        shell: bash
        run: |
          printf "%s" "${{ steps.notes.outputs.body }}" > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "Release ${{ github.ref_name }}" > NOTES.md
          fi

      - name: Generate unified SHA256SUMS
        shell: bash
        working-directory: collected
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            find . -type f -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          else
            # Fallback (macOS style) - not expected on ubuntu-latest, but harmless
            find . -type f -print0 | xargs -0 shasum -a 256 > SHA256SUMS.txt
          fi

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              $([ "$(echo "$TAG" | grep -c -- '-rc')" -gt 0 ] && echo --prerelease) \
              --title "$TAG" --notes-file NOTES.md
          else
            gh release edit "$TAG" --draft \
              $([ "$(echo "$TAG" | grep -c -- '-rc')" -gt 0 ] && echo --prerelease) \
              --title "$TAG" --notes-file NOTES.md
          fi

      - name: Upload assets (files only; clobber duplicates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          mapfile -d '' files < <(find collected -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files found under collected/"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
