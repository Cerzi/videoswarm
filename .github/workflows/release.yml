name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: linux
          # Electron 43 / better-sqlite3 currently requires a source rebuild on
          # Windows. Pin VS 2022 until the dependency publishes ABI 148 assets;
          # node-gyp 10 cannot discover the VS 18 image on windows-latest.
          - os: windows-2022
            artifact-name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        env:
          npm_config_msvs_version: ${{ runner.os == 'Windows' && '2022' || '' }}
        run: npm ci

      - name: Install Linux build dependencies
        if: matrix.artifact-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            icnsutils \
            graphicsmagick \
            libarchive-tools \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxkbcommon0 \
            libxss1 \
            xvfb \
            xz-utils

      - name: Build Linux Debian package
        if: matrix.artifact-name == 'linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run vite:build
          npx electron-builder --linux deb --publish=never

      - name: Build Windows application
        if: matrix.artifact-name == 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run electron:dist

      - name: Install and smoke-test Linux Debian package
        if: matrix.artifact-name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find dist -maxdepth 1 -type f -name "VideoSwarm-*-linux.deb" | sort)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux .deb, found ${#debs[@]}"
            exit 1
          fi
          if find dist -maxdepth 1 -type f -name "*.AppImage" | grep -q .; then
            echo "AppImage output is forbidden by the Linux release policy"
            exit 1
          fi
          dpkg-deb -f "${debs[0]}" Depends | grep -Eq '(^|, )libasound2(,|$)'
          sudo apt-get install -y "./${debs[0]}"
          test "$(stat -c '%U:%G %a' /opt/VideoSwarm/chrome-sandbox)" = "root:root 4755"
          env -u VIDEOSWARM_DISABLE_SANDBOX \
            VIDEOSWARM_DEB_SMOKE=1 \
            xvfb-run -a \
            npx playwright test tests/electron/deb-package.smoke.spec.cjs \
              --config=playwright.electron.config.cjs

      - name: Upload Linux package smoke diagnostics
        if: failure() && matrix.artifact-name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          if [ "${{ matrix.artifact-name }}" = "linux" ]; then
            mapfile -t assets < <(find dist -maxdepth 1 -type f -name "VideoSwarm-*-linux.deb" | sort)
            if [ "${#assets[@]}" -ne 1 ]; then
              echo "Expected exactly one Linux release asset, found ${#assets[@]}"
              exit 1
            fi
          else
            mapfile -t assets < <(find dist -maxdepth 1 -type f -name "VideoSwarm-*-win-x64*.exe" | sort)
            if [ "${#assets[@]}" -ne 2 ]; then
              echo "Expected exactly two Windows release assets, found ${#assets[@]}"
              exit 1
            fi
          fi
          cp "${assets[@]}" release-assets/

      - name: List artifacts
        shell: bash
        run: |
          echo "Release assets:"
          ls -la release-assets/ || echo "No release-assets directory found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoswarm-${{ matrix.artifact-name }}
          path: release-assets/
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail

          mkdir -p release-files

          mapfile -t linux_assets < <(find all-artifacts -maxdepth 3 -type f -name "VideoSwarm-*-linux.deb" | sort)
          mapfile -t windows_assets < <(find all-artifacts -maxdepth 3 -type f -name "VideoSwarm-*-win-x64*.exe" | sort)
          if [ "${#linux_assets[@]}" -ne 1 ] || [ "${#windows_assets[@]}" -ne 2 ]; then
            echo "Expected one Linux .deb and two Windows executables"
            echo "Found ${#linux_assets[@]} Linux and ${#windows_assets[@]} Windows assets"
            exit 1
          fi
          cp "${linux_assets[@]}" "${windows_assets[@]}" release-files/

          echo "Final release files:"
          ls -la release-files/

          FILE_COUNT=$(find release-files -type f | wc -l)
          if [ "$FILE_COUNT" -ne 3 ]; then
            echo "Expected 3 release files, found $FILE_COUNT"
            exit 1
          fi

      - name: Generate release notes with checksums
        id: release_notes
        run: |
          set -euo pipefail

          TAG_NAME="${{ github.ref_name }}"
          BASE_TAG="${TAG_NAME%%-*}"
          HIGHLIGHTS_FILE="docs/releases/${BASE_TAG}.md"

          pushd release-files >/dev/null
          sha256sum * | sort > ../checksums.txt
          popd >/dev/null

          {
            printf '# VideoSwarm %s\n\n' "$TAG_NAME"

            if [[ "$TAG_NAME" == *-* ]]; then
              cat << 'EOF'
          > **Pre-release:** Please back up irreplaceable profile data before
          > upgrading and report upgrade, playback, or file-operation regressions.

          EOF
            fi

            if [ -f "$HIGHLIGHTS_FILE" ]; then
              cat "$HIGHLIGHTS_FILE"
              printf '\n'
            fi

            cat << EOF
          ## Installation
          - **Windows**
            - \`VideoSwarm-*-win-x64.exe\`: Installer (recommended)
            - \`VideoSwarm-*-win-x64-Portable.exe\`: Portable build (no installation)
          - **Linux**
            - \`VideoSwarm-*-linux.deb\`: On Debian/Ubuntu x64, install with
              \`sudo apt install ./VideoSwarm-*-linux.deb\`, then launch
              \`video-swarm\`
            - Portable AppImages and production no-sandbox launches are not
              supported

          ## Checksums (SHA256)

          \`\`\`
          $(cat checksums.txt)
          \`\`\`
          EOF
          } > release_notes.md

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          
          # Determine if this is a prerelease
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *"-rc"* ]] || [[ "$TAG_NAME" == *"-beta"* ]] || [[ "$TAG_NAME" == *"-alpha"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          # Create the release
          gh release create "$TAG_NAME" \
            --draft \
            $PRERELEASE_FLAG \
            --title "VideoSwarm $TAG_NAME" \
            --notes-file release_notes.md \
            release-files/*
