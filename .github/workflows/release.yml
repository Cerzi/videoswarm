name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux
          - os: windows-latest
            artifact-name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            icnsutils graphicsmagick xz-utils rpm

      - name: Build application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run electron:dist

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          if [ -d "dist" ]; then
            # Copy all build artifacts
            cp -r dist/* release-assets/ 2>/dev/null || true
            
            # Generate checksums
            cd release-assets
            if command -v sha256sum >/dev/null 2>&1; then
              find . -type f -exec sha256sum {} \; > SHA256SUMS-${{ matrix.artifact-name }}.txt
            elif command -v shasum >/dev/null 2>&1; then
              find . -type f -exec shasum -a 256 {} \; > SHA256SUMS-${{ matrix.artifact-name }}.txt
            fi
          fi

      - name: List artifacts
        shell: bash
        run: |
          echo "Release assets:"
          ls -la release-assets/ || echo "No release-assets directory found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videoswarm-${{ matrix.artifact-name }}
          path: release-assets/
          if-no-files-found: warn

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-files
          # Flatten all artifacts into release-files directory
          find all-artifacts -type f -exec cp {} release-files/ \;
          
          echo "Final release files:"
          ls -la release-files/

      - name: Generate release notes
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          
          # Create basic release notes
          cat > release_notes.md << EOF
          # VideoSwarm $TAG_NAME
          
          ## Installation
          - **Windows**: Download and run the \`.exe\` installer
          - **Linux**: Use the \`.AppImage\` file or install via package manager if available
          
          ## What's Changed
          See the commit history for detailed changes in this release.
          
          ## Notes
          - Check the README for system requirements and known limitations
          - Report issues on our GitHub repository
          EOF

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          
          # Determine if this is a prerelease
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *"-rc"* ]] || [[ "$TAG_NAME" == *"-beta"* ]] || [[ "$TAG_NAME" == *"-alpha"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          # Create the release
          gh release create "$TAG_NAME" \
            --draft \
            $PRERELEASE_FLAG \
            --title "VideoSwarm $TAG_NAME" \
            --notes-file release_notes.md \
            release-files/*